name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          ENV: test
          JWT_SECRET_KEY: test-key-ci-github-actions
        run: |
          python -m pytest tests -q --ignore=tests/test_playwright_e2e.py --ignore=tests/test_playwright_judge_journey.py

      - name: Run Engine Unit Test
        env:
          ENV: test
        run: |
          python tests/test_engine_unit.py

  frontend-build:
    name: Frontend Static Export Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build static export
        working-directory: ./frontend
        env:
          NEXT_EXPORT: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload frontend static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 1

  playwright-e2e:
    name: Playwright Browser E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install playwright pytest
          playwright install --with-deps chromium

      - name: Download frontend static export
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      - name: Run Playwright E2E Tests
        env:
          ENV: test
          JWT_SECRET_KEY: test-key-ci-github-actions
        run: |
          python -m pytest tests/test_playwright_e2e.py tests/test_playwright_judge_journey.py -v
